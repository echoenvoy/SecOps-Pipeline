# ==============================================================================
# Indicative CI/CD Pipeline Skeleton
# Ref: Specification Document (Appendix A) & Implementation Plan (Phase 3)
# ==============================================================================

stages:
  - sast
  - quality-gate
  - build
  - deploy

variables:
  IMAGE_NAME: "target-app"
  DOCKERFILE: "docker/Dockerfile"

# -------------------------------------------------------------
# Stage 1: SAST (Semgrep)
# -------------------------------------------------------------
sast:
  stage: sast
  image: returntocorp/semgrep:latest
  script:
    - echo "=== [STAGE 1] SAST - Semgrep Static Application Security Testing ==="
    - mkdir -p reports
    - semgrep --config p/owasp-top-ten --config security/semgrep/rules.yml --error --json -o reports/semgrep.json app/
  artifacts:
    paths:
      - reports/semgrep.json
      - reports/semgrep.sarif
    when: always

