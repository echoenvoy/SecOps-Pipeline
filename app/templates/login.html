{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 3rem auto;">
    <h2>Sign In</h2>
    <p style="color: #94a3b8; font-size: 0.9rem;">Demonstrates Authentication & Wazuh log generation.</p>
    
    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}
    
    <form method="POST" action="/login">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: #94a3b8;">Username:</label>
            <input type="text" name="username" style="width: 100%; box-sizing: border-box;" required placeholder="admin / alice / bob">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: #94a3b8;">Password:</label>
            <input type="password" name="password" style="width: 100%; box-sizing: border-box;" required placeholder="Password">
        </div>
        <button type="submit" style="width: 100%; padding: 0.75rem;">Login</button>
    </form>
    
    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #334155; font-size: 0.85rem; color: #64748b;">
        <p><strong>Test Credentials:</strong></p>
        <ul>
            <li><code>admin</code> / <code>admin123</code></li>
            <li><code>alice</code> / <code>alice123</code></li>
            <li><code>bob</code> / <code>bob123</code></li>
        </ul>
    </div>
</div>
{% endblock %}
