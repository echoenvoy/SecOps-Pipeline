<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default("DevSecOps Target App") }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; }
        nav { background: #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        nav a { color: #38bdf8; text-decoration: none; margin-right: 1.5rem; font-weight: 500; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; margin-bottom: 1.5rem; }
        h1, h2, h3 { color: #f1f5f9; }
        input, button, select { padding: 0.6rem 1rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 1rem; }
        button { background: #0284c7; color: white; border: none; cursor: pointer; font-weight: 600; }
        button:hover { background: #0369a1; }
        .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; background: #ef4444; color: white; }
        .alert { padding: 1rem; border-radius: 6px; margin-bottom: 1rem; background: #450a0a; border: 1px solid #991b1b; color: #fca5a5; }
        .success { background: #064e3b; border: 1px solid #065f46; color: #6ee7b7; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; }
        code { background: #0f172a; padding: 0.2rem 0.4rem; border-radius: 4px; color: #f43f5e; font-family: monospace; }
    </style>
</head>
<body>
    <nav>
        <div>
            <a href="/" style="font-weight: 700; font-size: 1.1rem; color: #38bdf8;">DevSecOps Target App</a>
            <span class="badge">TESTBED</span>
        </div>
        <div>
            {% if session.get('username') %}
                <span style="margin-right: 1rem; color: #94a3b8;">User: <strong>{{ session['username'] }}</strong></span>
                <a href="/logout">Logout</a>
            {% else %}
                <a href="/login">Login</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
